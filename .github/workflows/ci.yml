name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel stale runs on the same ref so a fresh push doesn't queue behind
# a now-irrelevant build. Cuts feedback time on rapid iteration.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to read-only — workflows that need write narrow it per-job.
permissions:
  contents: read

# The two packages run on different Node versions, so CI tests each on the one
# it actually uses.
#
# Backend: pinned to 20 because that is what render.yaml gives it in production.
# Testing it on anything newer would let a Node-22-only construct pass CI and
# then crash on deploy.
#
# Frontend: 22, because jsdom's transitive `html-encoding-sniffer@6` require()s
# an ES module, which only works from Node 22.12 onward. On 20 the whole Vitest
# run dies with ERR_REQUIRE_ESM before a single test executes. Nothing shipped
# to the browser depends on this — it is a test-runner-only constraint.
env:
  NODE_VERSION: '20'
  FRONTEND_NODE_VERSION: '22'
  # The tree lints clean; keep it that way.
  LINT_MAX_WARNINGS: '0'

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend · lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FRONTEND_NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint (gate at baseline)
        run: npx eslint . --max-warnings=${{ env.LINT_MAX_WARNINGS }}

  frontend-typecheck:
    name: Frontend · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FRONTEND_NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # Gates the incremental TS migration: tsconfig relaxes noImplicitAny /
      # strictNullChecks for now, but everything already typed must stay typed.
      - name: tsc --noEmit
        run: npm run typecheck

  frontend-test:
    name: Frontend · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FRONTEND_NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Vitest (single run)
        run: npm test

  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FRONTEND_NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload dist for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  # ── Backend ─────────────────────────────────────────────────────────────
  backend-smoke:
    name: Backend · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install (better-sqlite3 needs build tools on first install)
        run: npm ci
      # node:test — covers bulkSetProgress' last-write-wins merge and the auth
      # routes. Runs against a temp SQLite file via ONSITE_DATA_DIR.
      - name: Unit tests (node --test)
        run: npm test
      - name: Smoke (db init + getStats)
        run: |
          node -e "
          const db = require('./database');
          db.init();
          const s = db.getStats();
          if (!s || typeof s.totalQuestions !== 'number' || s.totalQuestions < 1) {
            console.error('Smoke failed:', s);
            process.exit(1);
          }
          console.log('topics=', db.getTopics().length, 'questions=', s.totalQuestions);
          db.close();
          "
      - name: Boot server briefly and hit /healthz
        run: |
          npm start &
          SERVER_PID=$!
          # Wait up to 15s for the server to come up
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3001/healthz >/dev/null 2>&1; then
              echo "Server is up"
              break
            fi
            sleep 1
          done
          set -o pipefail
          curl -fsS http://localhost:3001/healthz | head -c 200
          kill $SERVER_PID || true

  # ── Route smoke ─────────────────────────────────────────────────────────
  # Loads every public route of the built app in an anonymous session at
  # 360px and 1280px, light and dark, EN and RU, and fails on a page error,
  # a missing <h1>, the ErrorBoundary fallback or horizontal overflow.
  frontend-smoke:
    name: Frontend · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FRONTEND_NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Serve and smoke
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -fsS "http://localhost:4173/${GITHUB_REPOSITORY#*/}/" >/dev/null 2>&1 && break
            sleep 1
          done
          SMOKE_URL=http://localhost:4173 npm run smoke
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: frontend/.smoke
          retention-days: 7
          if-no-files-found: ignore

  # ── Repo-level invariants ───────────────────────────────────────────────
  repo-invariants:
    name: Repo · invariants
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      # The invariants CLAUDE.md describes in prose, as greps. Each one
      # produced a green local run and a broken deploy at least once.
      - name: contentRu stays a dynamic import
        run: |
          if grep -rn "from './contentRu'" frontend/src --include='*.ts' --include='*.tsx' | grep -v 'i18n/content.ts'; then
            echo "::error::contentRu.ts must only be imported dynamically from i18n/content.ts"; exit 1; fi
      - name: every API call lives in api/api.ts
        run: |
          if grep -rnE '\b(api|axios)\.(get|post|put|patch|delete)\(|\bfetch\s*\(' frontend/src --include='*.ts' --include='*.tsx' \
              | grep -vE 'src/api/api\.ts|src/store/auth\.ts|src/lib/knowledge\.ts|src/lib/push\.ts|src/i18n/|\.test\.'; then
            echo "::error::call the backend through api/api.ts (tryRemote) only"; exit 1; fi
      - name: persistence keys are frozen
        run: |
          grep -q "readytoflutter_progress_v1" frontend/src/api/api.ts
          grep -q "readytoflutter_progress_v1" frontend/src/lib/activity.ts
          grep -q "'rtf:srs:v1'" frontend/src/lib/srs.ts
          grep -q "'rtf:bookmarks:v1'" frontend/src/lib/bookmarks.ts
          grep -q "'rtf:prefs:v1'" frontend/src/store/prefs.ts
      - name: prerender contract on /roadmap
        run: grep -q 'id={`rung-' frontend/src/pages/RoadmapPage.tsx
      - name: the worker keeps a navigation request's redirect mode
        run: |
          if grep -A 8 'requestWillFetch' frontend/vite.config.js | grep -q 'new globalThis.Request' \
             && ! grep -A 8 'requestWillFetch' frontend/vite.config.js | grep -q 'redirect: request.redirect'; then
            echo "::error::a rebuilt navigation Request must carry redirect: request.redirect — it defaults to 'follow', and a redirected response is invalid for a navigation"; exit 1; fi

  static-data-sync:
    name: Repo · static-data parity
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Pure-Node script — no install. Fails the PR if the committed
      # frontend/public/seed/static-data.json drifts from backend seed JSON.
      - name: Verify static-data.json matches backend seeds
        run: node backend/scripts/generate-static-data.js --check

  # ── Aggregate gate ──────────────────────────────────────────────────────
  # Single required check for branch protection — succeeds only if every
  # parallel job succeeded. Lets us add/remove jobs without touching the
  # branch-protection rule.
  ci-passed:
    name: CI · all checks
    runs-on: ubuntu-latest
    needs:
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-build
      - frontend-smoke
      - backend-smoke
      - repo-invariants
      - static-data-sync
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All checks passed."
